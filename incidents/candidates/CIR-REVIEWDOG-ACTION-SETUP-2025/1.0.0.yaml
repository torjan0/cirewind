spec:
  description: On 2025-03-11 the mutable v1 tag of reviewdog/action-setup was overwritten to point at commit f0d342d24037bb11d26b9bd8496e0808ba32e9ec, whose installer wrote exposed secrets into workflow logs, and was later restored. The maintainers published the tag exposure as 18:42 through 20:31 UTC at minute precision. Wrapper Actions that resolved action-setup@v1 during that period were transitively exposed; this pack does not label any wrapper commit compromised and does not enumerate wrapper versions, because no primary source binds a wrapper commit to its historical nested declaration.
  components:
    - id: action-setup
      type: github-action
      repository:
        owner: reviewdog
        name: action-setup
      subpaths:
        - ""
  windows:
    - id: v1-tag-compromise
      start: "2025-03-11T18:42:00Z"
      end: "2025-03-11T20:32:00Z"
      bounds: "[)"
      sourcePrecision: minute
      approximation: source-rounded
      originalClaim: "March 11, 2025, between 18:42 and 20:31 UTC"
      sourceRefs:
        - ghsa-maintainer
      notes: The source states minute precision. The start is the stated minute; the end is rounded up to the exclusive next-minute boundary so that every instant inside the stated final minute is covered without inventing seconds.
  indicators:
    - id: action-setup-malicious-commit
      componentId: action-setup
      kind: action-commit
      value:
        gitObject:
          algorithm: sha1
          value: "f0d342d24037bb11d26b9bd8496e0808ba32e9ec"
      windowRefs:
        - v1-tag-compromise
      confidence: L4_CERTAIN
      sourceRefs:
        - ghsa-maintainer
        - ghsa-database
        - commit-f0d342d
      notes: The maintainer advisory names the object as the malicious commit; the pinned database record and the commit object resolve it to the full identifier.
    - id: action-setup-v1-mutable-ref
      componentId: action-setup
      kind: mutable-action-ref
      value:
        ref: v1
      windowRefs:
        - v1-tag-compromise
      confidence: L4_CERTAIN
      sourceRefs:
        - ghsa-maintainer
        - issue-2079
      notes: Only the v1 tag is claimed. The maintainer's 2025-03-23 update states that audit review found only v1 affected.
  knownGood: []
  remediation:
    guidance:
      - Resolve every historical run attempt that declared reviewdog/action-setup@v1 during the window to its exact runtime object before drawing a conclusion; the current v1 tag target says nothing about what a March 2025 run resolved.
      - Treat wrapper Actions that nest reviewdog/action-setup@v1 as transitive candidates to reconstruct from their exact historical metadata; a wrapper pinned by full commit can still have resolved the mutable nested ref, and the wrapper commit itself is not an incident indicator.
      - Pin reviewdog/action-setup and every wrapper Action to a full commit object and verify the nested dependencies pinned inside each wrapper.
    credentialRotationTriggers:
      - id: rotate-after-execution
        whenStates:
          - CONFIRMED_EXECUTED
        guidance: Rotate every secret the affected job could read; the malicious commit wrote exposed secrets into the workflow log, which does not by itself prove which values were recovered.
        confidence: L4_CERTAIN
        sourceRefs:
          - ghsa-maintainer
