  windows:
    - id: dockerhub-images
      start: "2026-03-22T15:43:00Z"
      end: "2026-03-23T01:41:00Z"
      bounds: "[)"
      sourcePrecision: minute
      approximation: source-rounded
      originalClaim: "2026-03-22 15:43 to 2026-03-23 ~01:40 (UTC)"
      sourceRefs:
        - discussion-10425
        - discussion-10462
        - ghsa-database
        - ghsa-maintainer
      notes: "Row 4 of the exposure window table. The start is the minute of the first Docker Hub push, which discussion 10462 repeats together with a second push at 16:34 UTC; the end is marked approximate and discussion 10462 states removal at 01:40 UTC on March 23. Encoded at the stated minutes with the exclusive minute boundary after ~01:40 and no expansion."
    - id: setup-trivy-tags
      start: "2026-03-19T17:43:00Z"
      end: "2026-03-19T21:45:00Z"
      bounds: "[)"
      sourcePrecision: minute
      approximation: source-rounded
      originalClaim: "2026-03-19 ~17:43 [^2] to 2026-03-19 ~21:44 (UTC)"
      sourceRefs:
        - discussion-10425
        - discussion-10462
        - ghsa-database
        - ghsa-maintainer
      notes: "Row 3 of the exposure window table. Both endpoints are marked approximate by the publisher; the maintainer text states the malicious releases were removed within about four hours and v0.2.6 was re-created with safe content, so the same tag name has a malicious identity inside this window and a safe identity after it. Encoded at the stated minutes without expansion."
    - id: trivy-action-tags
      start: "2026-03-19T17:43:00Z"
      end: "2026-03-20T05:41:00Z"
      bounds: "[)"
      sourcePrecision: minute
      approximation: source-rounded
      originalClaim: "2026-03-19 ~17:43 [^2] to 2026-03-20 ~05:40 (UTC)"
      sourceRefs:
        - discussion-10425
        - discussion-10462
        - ghsa-database
        - ghsa-maintainer
      notes: "Row 2 of the exposure window table. Both endpoints are marked approximate by the publisher; footnote 2 states that 17:43 UTC is the earliest suspicious activity in the audit log. Encoded at the stated minutes with the exclusive minute boundary after ~05:40 and no expansion. Runs shortly outside these minutes deserve manual review because the publisher states no error margin."
    - id: trivy-binary-v0-69-4
      start: "2026-03-19T18:22:00Z"
      end: "2026-03-19T21:43:00Z"
      bounds: "[)"
      sourcePrecision: minute
      approximation: source-rounded
      originalClaim: "2026-03-19 18:22 [^1] to 2026-03-19 ~21:42 (UTC)"
      sourceRefs:
        - discussion-10425
        - discussion-10462
        - ghsa-database
        - ghsa-maintainer
      notes: "Row 1 of the exposure window table. The start is the minute at which the v0.69.4 release artifacts became publicly available (footnote 1) and is not marked approximate; the end is marked approximate by the publisher with a tilde. Both endpoints are encoded at the stated minute, the end as the exclusive minute boundary after ~21:42, without any expansion; the publisher gives no error margin. Discussion 10462 places the release build trigger at 17:47 UTC and the token revocation at 22:42 UTC."
