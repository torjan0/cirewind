  knownGood: []
  remediation:
    guidance:
      - "Treat each component separately: trivy-action tags, setup-trivy tags, the v0.69.4 release assets, and the Docker Hub images have different windows, and a run is assessed against the window of the component it actually resolved."
      - "Resolve every historical run attempt that declared aquasecurity/trivy-action or aquasecurity/setup-trivy by tag during its component window to the exact runtime object before drawing a conclusion; the malicious objects were removed and never published, so identity comes from the run log, never from present-day tags, and v0.2.6 in particular has a malicious identity inside its window and a safe identity after it."
      - "A trivy-action reference pinned to a full commit from before 2025-04-09 resolved setup-trivy by tag inside the action, so such a run is transitively exposed during the setup-trivy window even though the pinned wrapper object itself is not malicious."
      - "An explicit version latest input to trivy-action, or any direct download, fetched the compromised v0.69.4 binary during the binary window; CIRewind archives no evidence of that download, so a run with this input inside the binary window must be reviewed by hand against the retained log and the release-asset digests."
      - "The publisher marks most window endpoints approximate without an error margin; review runs shortly before or after an encoded endpoint by hand rather than treating the encoded minute as an observation."
      - "If exfiltration is suspected, look for public repositories whose names carry the tpcp-docs- prefix in the affected GitHub account; this fallback indicator cannot be encoded as an exact repository-name indicator."
      - "Search retained raw logs by hand for the command-and-control host scan.aquasecurtiy.org and the address 45.148.10.212, and for the version strings 0.69.4, 0.69.5, and 0.69.6; CIRewind cannot evaluate literal indicators from a compact archive that discarded the raw log, so these literals are stated here rather than encoded, and a literal match never by itself proves which component executed."
      - "Pin aquasecurity/trivy-action and aquasecurity/setup-trivy to full commit objects that have been independently reviewed; the maintainer names v0.35.0 and the re-created v0.2.6 as safe, but no object is encoded as known good until reviewers verify it."
    credentialRotationTriggers:
      - id: rotate-after-execution
        whenStates:
          - CONFIRMED_EXECUTED
        guidance: "Rotate every secret the affected job could read; the malicious code dumped runner process memory and swept the filesystem for credentials before sending them to attacker infrastructure, which does not by itself prove which values were recovered."
        confidence: L4_CERTAIN
        sourceRefs:
          - ghsa-maintainer
      - id: rotate-after-possible-exposure
        whenStates:
          - POTENTIAL_TRANSITIVE
          - RUN_IN_WINDOW_MUTABLE_REF
        guidance: "The maintainer states that any possibility of a compromised version having run means all secrets accessible to the pipeline must be treated as exposed; rotate them unless the exact runtime object is shown to be safe."
        confidence: L3_STRONG
        sourceRefs:
          - ghsa-maintainer
