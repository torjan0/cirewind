metadata:
  id: CIR-AQUASECURITY-TRIVY-2026
  packVersion: 1.0.0
  title: "Trivy ecosystem supply chain compromise, 2026-03-19 to 2026-03-23"
  publishedAt: "2026-09-03T00:00:00Z"
  updatedAt: "2026-09-03T00:00:00Z"
  labels:
    - candidate
    - container-image
    - embedded-tool
    - github-actions
    - mutable-tag
  sources:
    - id: ghsa-maintainer
      type: primary-advisory
      title: "Trivy ecosystem supply chain temporarily compromised"
      publisher: "Aqua Security Trivy maintainers, GitHub security advisory GHSA-69fq-xp46-6x23"
      url: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
      publishedAt: "2026-03-21T15:51:56Z"
      retrievedAt: "2026-09-03T04:45:11Z"
      sourceRevision: rest-advisory-updated-at-2026-03-30T16:44:30Z
      sourceSha256: c0ec987f2a9abc7436615dd7d89dd6b464e5b7fc04db13166f2ac2dbfa3494c0
      timePrecision: minute
      notes: "Retrieved as GET /repos/aquasecurity/trivy/security-advisories/GHSA-69fq-xp46-6x23. Material statements: the four-row exposure window table with footnotes marking approximate endpoints, the 76 of 77 trivy-action tag force-push, the seven setup-trivy tags v0.2.0 to v0.2.6, the v-prefixed re-publication of the original tags with three named unrestored tags, the version latest exposure, the pre-2025-04-09 SHA-pin transitive exposure, the 26-row executable table, the 15-row container image table, and the two network literals. The two IOC tables and the network list were transformed mechanically by the trivy-2026-advisory-tables extractor, whose record is committed beside the fixtures."
    - id: ghsa-database
      type: github-advisory-database
      title: "GHSA-69fq-xp46-6x23 reviewed record (CVE-2026-33634)"
      publisher: "GitHub Advisory Database"
      url: https://github.com/github/advisory-database/blob/fa95208a0a9d23397334d6d71255ba089f49a067/advisories/github-reviewed/2026/03/GHSA-69fq-xp46-6x23/GHSA-69fq-xp46-6x23.json
      publishedAt: "2026-03-24T17:53:12Z"
      retrievedAt: "2026-09-03T04:45:11Z"
      sourceRevision: fa95208a0a9d23397334d6d71255ba089f49a067
      sourceSha256: 51e2e8bf05e21b78201549838254192d9fa036ccab588f396740dd4a43f47bf5
      timePrecision: minute
      notes: "The GitHub Advisory Database is published under CC-BY 4.0 and is redistributed with attribution to GitHub. The details field repeats the maintainer advisory text including the window table and both IOC tables; the affected ranges state trivy-action fixed in 0.35.0, setup-trivy fixed in 0.2.6, and the Go module affected only at 0.69.4."
    - id: discussion-10425
      type: vendor-incident-report
      title: "Trivy Security incident 2026-03-19"
      publisher: "Aqua Security Trivy maintainers, GitHub discussion aquasecurity/trivy#10425"
      url: https://github.com/aquasecurity/trivy/discussions/10425
      publishedAt: "2026-03-20T12:52:05Z"
      retrievedAt: "2026-09-03T04:45:11Z"
      sourceRevision: graphql-discussion-last-edited-at-2026-04-14T12:00:26Z
      sourceSha256: 0a4bbc9354bb5e90c1a4a096d4c55ee52572f550175b37e15f0f895c78a2e353
      timePrecision: minute
      notes: "Retrieved through the GraphQL discussion object (number, title, body, createdAt, updatedAt, lastEditedAt). The initial maintainer statement repeats the window table, names the safe releases trivy v0.69.3, trivy-action v0.35.0 at commit 57a97c7e7821a5776cebc9bb87c984fa69cba8f1, and setup-trivy v0.2.6 at commit 3fb12ec12f41e471780db15c232d5dd185dcb514, and repeats the C2 domain and address with bracketed dots. Its footnote states that the first malicious activity observed was at 2026-03-19 17:43 UTC."
    - id: discussion-10462
      type: vendor-incident-report
      title: "Trivy Security incident 2026-03-19 conclusion"
      publisher: "Aqua Security Trivy maintainers, GitHub discussion aquasecurity/trivy#10462"
      url: https://github.com/aquasecurity/trivy/discussions/10462
      publishedAt: "2026-03-30T15:12:53Z"
      retrievedAt: "2026-09-03T04:45:11Z"
      sourceRevision: graphql-discussion-last-edited-at-2026-03-30T15:14:01Z
      sourceSha256: 7167941e968929e33c69a844da356431ca6bc82a206aab6df135757c1c0a6fb1
      timePrecision: minute
      notes: "The conclusion timeline states that the malicious v0.69.4 release build was triggered at 17:47 UTC on March 19, that the compromised token was revoked at 22:42 UTC, that the 0.69.5 and 0.69.6 Docker Hub tags were pushed at 15:43 UTC and 16:34 UTC on March 22, and that the malicious Docker Hub tags were removed at 01:40 UTC on March 23."
    - id: trivy-action-tags
      type: source-repository
      title: "aquasecurity/trivy-action tag listing at retrieval"
      publisher: "aquasecurity/trivy-action repository, GitHub REST matching-refs listing"
      url: https://github.com/aquasecurity/trivy-action/tags
      publishedAt: "2026-09-03T04:46:36Z"
      retrievedAt: "2026-09-03T04:46:36Z"
      sourceRevision: rest-matching-refs-retrieved-at-2026-09-03T04:46:36Z
      sourceSha256: 38f552d21beb0c9362af7a4e6bc7e15ce89c27df837d31a13e5920bcf77e8a63
      timePrecision: unknown
      notes: "Retrieved as GET /repos/aquasecurity/trivy-action/git/matching-refs/tags/ with pagination. It is current state, not a historical observation: 72 v-prefixed tags below 0.35.0, the immutable 0.35.0 tag, v0.35.0, and v0.36.0. The trivy-2026-action-tag-inventory extractor strips the v prefix from the 72 tags and adds the three unrestored names the advisory states, yielding 75 original names against the advisory count of 76 affected tags; one original name cannot be recovered from these sources."
spec:
  description: "On March 19, 2026 a threat actor with compromised credentials published a malicious Trivy v0.69.4 release, force-pushed 76 of 77 version tags of aquasecurity/trivy-action to credential-stealing content, and replaced all seven tags of aquasecurity/setup-trivy; on March 22 the same actor pushed malicious 0.69.5 and 0.69.6 images directly to Docker Hub. Each vector has its own maintainer-stated window and this pack keeps them separate: the trivy-action tags, the setup-trivy tags, the v0.69.4 release assets, and the Docker Hub images. Most endpoints are marked approximate by the publisher and are encoded at the stated minute without expansion. The malicious Action objects were never published, so the Action components carry only mutable refs: the seven setup-trivy tags named by the maintainer and 75 original trivy-action tag names derived mechanically from the current v-prefixed replacement tags plus the three unrestored names the maintainer lists; the maintainer counts 76 affected tags, so one name is unknown. The 26 release-asset and 15 image digests and the two network literals were extracted mechanically from the pinned advisory bytes with recorded input and output hashes; CIRewind does not observe release downloads or image pulls in v0.2 evidence, so the digests are retained for manual review rather than automatic exposure findings, and the network literals and version strings are stated in the guidance instead of being encoded because a compact archive cannot evaluate literal indicators. No known-good identity is encoded because the safe objects have not been independently reviewed and v0.2.6 has two historical identities, and the tpcp-docs- repository-name prefix cannot be encoded as an exact repository indicator."
